# Hyperparameters for IQL-JAX (Implicit Q-Learning)
#
# Notes:
# - This file follows an RL-Zoo-style format: each top-level environment id has its own config.
# - `n_timesteps` is treated as an alias for `max_timesteps` by the IQL-JAX runner.
# - In mode="refit", max_timesteps/batch_size/eval_freq are reused as the actor-only
#   refit steps, minibatch size, and evaluation interval.
# - CLI arguments override values loaded from this YAML file.
# - YAML anchors/merge keys are used to avoid repeating identical hyperparameters.
# - Top-level keys beginning with `_` are anchor definitions, not environments.
# - The original PyTorch configs use eval_freq: 5000, but the PyTorch TrainConfig multiplies
#   eval_freq by 5 in __post_init__. Therefore this JAX config uses 25000 directly.

_common: &common
  n_timesteps: !!float 1e6
  eval_freq: 25000
  log_every: 500

  # Dataset
  buffer_size: 10000000
  batch_size: 256
  normalize: true

  # IQL value/Q/actor learning
  discount: 0.99
  tau: 0.005
  beta: 3.0
  iql_tau: 0.7
  iql_deterministic: false
  qf_lr: !!float 3e-4
  vf_lr: !!float 3e-4
  actor_lr: !!float 3e-4

  # Standalone actor refit output directory. Refit reuses max_timesteps, batch_size, and eval_freq.
  actor_refit_dir_name: "actor_refit"

_mujoco: &mujoco
  <<: *common
  n_episodes: 10
  normalize_reward: false

_hopper_medium: &hopper_medium
  <<: *mujoco
  tau: 0.001
  iql_deterministic: true
  normalize_reward: true

_hopper_medium_expert: &hopper_medium_expert
  <<: *mujoco
  beta: 6.0
  iql_tau: 0.5

_antmaze: &antmaze
  <<: *common
  n_episodes: 10
  normalize_reward: true
  beta: 10.0
  iql_tau: 0.9

_maze2d: &maze2d
  <<: *common
  n_episodes: 100
  normalize_reward: false

_adroit: &adroit
  <<: *common
  n_episodes: 10
  normalize_reward: false
  iql_tau: 0.8
  actor_dropout: 0.1

