# IFQL hyperparameters for ifql_jax.py (ORL-SMOOTH).
# FQL paper, Appendix E.2 and Tables 5–6: OGBench discounts and IFQL N.
# The original IFQL default network width (512) is retained: the paper
# explicitly reports width 256 for IQL manipulation, not separately for IFQL.
# Visual settings follow the existing visual protocol.

_ogbench_common: &ogbench_common
  max_timesteps: 1000000
  eval_freq: 100000
  log_every: 5000
  batch_size: 256
  normalize_states: false
  normalize_reward: false
  action_clip_eps: 1.0e-5
  frame_stack: null
  p_aug: null

  lr: 3.0e-4
  actor_learning_rate: 3.0e-4
  critic_learning_rate: 3.0e-4
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  critic_ln: true
  actor_ln: false
  discount: 0.99
  tau: 0.005
  num_critics: 2
  q_agg: min
  expectile: 0.9
  num_samples: 32
  flow_steps: 10
  encoder: null
  n_episodes: 50
  eval_seed: 42
  eval_at_first_step: true

_ogbench_discount_0995: &ogbench_discount_0995
  <<: *ogbench_common
  discount: 0.995

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: 500000
  encoder: impala_small
  p_aug: 0.5
  frame_stack: 3

