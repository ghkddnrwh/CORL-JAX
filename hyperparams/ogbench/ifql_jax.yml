# Hyperparameters for ifql_jax.py (ORL-SMOOTH).
# Algorithm defaults: fql-master/agents/ifql.py:get_config().
# Paper-reproduction overrides: Flow Q-Learning (ICML 2025), Appendix E.2,
# Tables 5 and 6. Discount follows the paper's common settings; the
# state-based manipulation MLP reduction follows the stated IQL/IFQL
# shared-default convention (not a separate IFQL architecture table).
# IFQL Table 6 specifies num_samples=64 for antsoccer-arena and 32 elsewhere.
# Visual protocol: 500k steps / impala_small / p_aug=0.5 / frame_stack=3;
# retain the 512-wide MLPs and num_samples=32 for all five visual tasks.
# IFQL fixes two critics and min-Q; no FQL alpha or normalize_q_loss.

_ogbench_common: &ogbench_common
  max_timesteps: 1000000
  eval_freq: 100000
  log_every: 5000
  batch_size: 256
  normalize_states: false
  normalize_reward: false
  action_clip_eps: 1.0e-5
  frame_stack: null
  p_aug: null

  # One shared Adam optimizer; learning-rate aliases are for runner compatibility.
  lr: 3.0e-4
  actor_learning_rate: 3.0e-4
  critic_learning_rate: 3.0e-4
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  critic_ln: true
  actor_ln: false
  discount: 0.99
  tau: 0.005
  num_critics: 2
  q_agg: min
  expectile: 0.9
  num_samples: 32
  flow_steps: 10
  encoder: null
  n_episodes: 50
  eval_seed: 42
  eval_at_first_step: true

_ogbench_discount_0995: &ogbench_discount_0995
  <<: *ogbench_common
  discount: 0.995

# State-based manipulation only; override both explicit dimension tuples.
_ogbench_manipulation: &ogbench_manipulation
  <<: *ogbench_common
  hidden_dim: 256
  actor_hidden_dims: [256, 256, 256, 256]
  value_hidden_dims: [256, 256, 256, 256]

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: 500000
  encoder: impala_small
  p_aug: 0.5
  frame_stack: 3

