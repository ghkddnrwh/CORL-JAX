# DriftQL official README configurations translated to the ORL-SMOOTH interface.
# Algorithm and network update paths are preserved from agents/driftql.py.
# Algorithm fields come from original get_config and README; experiment fields follow the ORL interface.
# Original source: uploaded driftql-main.zip (agents/driftql.py, README.md).
# Fields with interface names: q_agg_actor -> actor_critic_aggregation;
# offline_steps -> max_timesteps, eval_interval -> eval_freq, log_interval -> log_every.
# Visual OGBench: official README does not specify a configuration; not invented here.

_ogbench_common: &ogbench_common
  max_timesteps: 1000000
  eval_freq: 100000
  log_every: 5000
  batch_size: 256
  normalize_states: false
  normalize_reward: false
  action_clip_eps: 1.0e-5
  frame_stack: null
  p_aug: null
  lr: 0.0003
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  critic_ln: true
  actor_ln: false
  discount: 0.99
  tau: 0.005
  q_agg: "min"
  actor_critic_aggregation: "mean"
  alpha: 10.0
  normalize_q_loss: false
  encoder: null
  kernel: "laplace"
  drift_temp: 0.2
  dim_scale: true
  drift_ngen: 32
  noise_dim: 0
  drift_eta: 1.0
  drift_normalize: false
  drift_batch_size: 256
  drift_eps: 1.0e-12
  n_episodes: 50
  eval_seed: 42
  eval_at_first_step: true
  checkpoint_freq: 25000
  save_best_model: true
  save_final_model: true

