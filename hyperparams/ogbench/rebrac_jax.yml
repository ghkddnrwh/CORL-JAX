# Hyperparameters for ReBRAC-JAX on OGBench
#
# Based on the FQL paper's ReBRAC baseline settings for OGBench:
# - ReBRAC's tuned method-specific parameters are the actor and critic BC coefficients.
# - Paper alpha_1 -> this runner's `actor_bc_coef`.
# - Paper alpha_2 -> this runner's `critic_bc_coef`.
# - OGBench default singletask aliases are included without task suffixes.
# - State-based tasks use 1e6 gradient steps; visual tasks use 5e5 steps.
#
# Compatibility notes:
# - This ReBRAC runner uses `discount` rather than `discount`.
# - This ReBRAC runner uses `normalize_states` rather than IQL's `normalize`.
# - Earlier logs showed some runners ignored `n_timesteps`; therefore this file includes
#   both `max_timesteps` and `n_timesteps`. Remove one if your runner warns about it.
# - The current state-based ReBRAC runner may need extra pixel-encoder support before the
#   visual-* entries below are directly runnable.

_ogbench_common: &ogbench_common
  max_timesteps: !!float 1e6
  n_timesteps: !!float 1e6
  eval_freq: 100000
  log_every: 500

  # Dataset
  batch_size: 256
  normalize_states: true
  normalize_reward: false

  # ReBRAC / TD3+BC-style actor-critic learning
  discount: 0.99
  tau: 0.005
  actor_learning_rate: !!float 3e-4
  critic_learning_rate: !!float 3e-4
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  num_critics: 2
  actor_ln: false
  critic_ln: true
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  normalize_q: true

  n_episodes: 50
  eval_seed: 42

  # Standalone actor refit output directory. Refit reuses max_timesteps, batch_size, and eval_freq.
  actor_refit_dir_name: "actor_refit"

_ogbench_discount_0995: &ogbench_discount_0995
  <<: *ogbench_common
  discount: 0.995

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: !!float 5e5
  n_timesteps: !!float 5e5
  # If your runner supports pixel-specific flags, use CLI options or add matching TrainConfig fields:
  # encoder: impala_small
  # p_aug: 0.5
  # frame_stack: 3

