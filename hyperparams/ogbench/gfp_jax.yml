# GFP (Guided Flow Policy) — official gfp_params.csv, ORL-SMOOTH interface.
# For any env, dataclass defaults < YAML < explicit CLI flags.
# Algorithmic settings come from the uploaded official guided-flow-policy-main.zip.
# No FQL alpha/aggregation settings have been transplanted into GFP.
# GFP's alpha is the actor distillation coefficient; eta_temperature is VaBC guidance temperature.

_ogbench_common: &ogbench_common
  max_timesteps: 1000000
  eval_freq: 100000
  log_every: 5000
  batch_size: 256
  normalize_states: false
  normalize_reward: false
  action_clip_eps: 1.0e-5
  frame_stack: null
  p_aug: null
  dataset_on_gpu: true
  n_steps_fused: 4
  buffer_size: 2000000

  lr: 3.0e-4
  actor_learning_rate: 3.0e-4
  critic_learning_rate: 3.0e-4
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  critic_ln: true
  actor_ln: false
  discount: 0.99
  tau: 0.005
  num_critics: 2
  q_agg: mean
  target_agg: actor
  guidance_agg: actor
  guidance_fn: softmax
  target_use_next: false
  normalize_q_loss: true
  encode_time_dim: 64
  alpha: 1.0
  eta_temperature: 0.001
  flow_steps: 10
  encoder: null
  n_episodes: 50
  eval_seed: 42
  eval_flow_policy: true
  eval_at_first_step: true
  checkpoint_freq: 25000
  save_best_model: true
  save_final_model: true

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: 500000
  dataset_on_gpu: false
  n_steps_fused: 1
  encoder: impala_small
  p_aug: 0.5
  frame_stack: 3

