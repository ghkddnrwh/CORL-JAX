# FAC original paper/official-code settings, written in the user's ORL-SMOOTH YAML style.
# Source: user-supplied FAC-main.zip / README.md / agents/fac.py:get_config().
# FAC ORIGINAL math is NOT FQL math: normalize_q_loss must be true by default.
# ORL mapping: fac_alpha -> critic_penalty_coef; fac_lambda -> actor_bc_coef;
#              lr_bc -> bc_learning_rate; value_layer_norm -> layer_norm.

_ogbench_common: &ogbench_common
  max_timesteps: 1000000           # FAC actor-critic updates only (not BC pretraining).
  eval_freq: 100000
  log_every: 5000
  checkpoint_freq: 25000
  n_episodes: 50
  eval_seed: 42
  eval_at_first_step: true
  save_best_model: true
  save_final_model: true

  batch_size: 256
  normalize_states: false
  normalize_reward: false
  action_clip_eps: 1.0e-5
  frame_stack: null
  p_aug: null

  actor_learning_rate: 3.0e-4   # FAC original AC optimizer lr
  critic_learning_rate: 3.0e-4  # accepted for ORL CLI; FAC uses the same AC optimizer
  bc_learning_rate: 3.0e-4      # FAC original flow-proxy optimizer lr_bc
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  bc_n_hiddens: 4
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  bc_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  bc_layer_norm: false
  critic_ln: true
  actor_ln: false
  encoder: null

  discount: 0.995
  tau: 0.005
  num_critics: 2
  q_agg: min
  flow_steps: 10
  normalize_q_loss: true
  distil_loss: true
  actor_bc_coef: 1.0        # FAC original fac_lambda (NOT FQL alpha)
  critic_penalty_coef: 1.0  # FAC original fac_alpha
  fac_threshold: batch_adaptive
  logp_method: exact
  logp_hutch_probes: 8
  weight_type: linear

  epoch_flow_proxy: 250
  bc_batch_size: null       # original FAC: 1x / 4x / 16x (state); 1x (visual)
  pretrained_bc_dir: pretrained_bc

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: 500000
  encoder: impala_small
  p_aug: 0.5
  frame_stack: 3
  epoch_flow_proxy: 125

_d4rl_common: &d4rl_common
  <<: *ogbench_common

