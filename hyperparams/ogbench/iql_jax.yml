# Hyperparameters for IQL-JAX on OGBench
#
# Based on the FQL paper's IQL baseline settings:
# - IQL expectile is fixed to 0.9 for all OGBench environments.
# - AWR inverse temperature alpha is tuned per OGBench environment family.
# - This file maps paper alpha -> this runner's `beta`, and paper expectile -> `iql_tau`.
# - OGBench default singletask aliases are included without task suffixes.
# - State-based tasks use 1e6 steps; visual tasks use 5e5 steps.
#
# Compatibility note:
# - Earlier logs showed some runners ignored `n_timesteps`; therefore this file includes
#   both `max_timesteps` and `n_timesteps`. Remove one if your runner warns about it.

_ogbench_common: &ogbench_common
  max_timesteps: !!float 1e6
  n_timesteps: !!float 1e6
  eval_freq: 25000
  log_every: 500

  # Dataset
  buffer_size: 10000000
  batch_size: 256
  normalize: true

  # IQL value/Q/actor learning
  discount: 0.99
  tau: 0.005
  beta: 10.0          # AWR inverse temperature alpha in the FQL paper
  iql_tau: 0.9        # IQL expectile
  iql_deterministic: false
  qf_lr: !!float 3e-4
  vf_lr: !!float 3e-4
  actor_lr: !!float 3e-4
  hidden_dim: 256
  n_hidden: 2

  n_episodes: 10
  normalize_reward: false

  # Standalone actor refit output directory. Refit reuses max_timesteps, batch_size, and eval_freq.
  actor_refit_dir_name: "actor_refit"

_ogbench_discount_0995: &ogbench_discount_0995
  <<: *ogbench_common
  discount: 0.995

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: !!float 5e5
  n_timesteps: !!float 5e5
  # If your runner supports pixel-specific flags, use these CLI options or add matching fields:
  # encoder: impala_small
  # p_aug: 0.5
  # frame_stack: 3

# -----------------------------------------------------------------------------
# OGBench state-based tasks: 10 environment families x 5 tasks
# -----------------------------------------------------------------------------

