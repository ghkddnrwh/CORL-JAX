# Hyperparameters for rebrac_fql_interface.py
#
# Goal:
#   Reproduce the FQL repository's ReBRAC code path while keeping the
#   IQL_JAX-style runner interface: pyrallis config, env-specific YAML loading,
#   wandb logging, checkpoint saving/loading, eval_logs.npz, and actor_refit.
#
# Important reproduction notes:
#   - normalize_states is intentionally false. FQL's OGBench ReBRAC path does
#     not normalize vector observations by dataset mean/std.
#   - actor_hidden_dims/value_hidden_dims are explicitly set to [512,512,512,512]
#     to match FQL ReBRAC, rather than relying only on hidden_dim/n_hiddens aliases.
#   - policy_freq maps to FQL's actor_freq.
#   - policy_noise/noise_clip map to FQL's actor_noise/actor_noise_clip.
#   - actor_bc_coef/critic_bc_coef map to FQL's alpha_actor/alpha_critic.
#   - action_clip_eps keeps FQL's dataset action clipping: [-1 + eps, 1 - eps].
#   - For visual tasks, FQL uses encoder=impala_small, p_aug=0.5, frame_stack=3,
#     and max_timesteps=5e5.

_ogbench_common: &ogbench_common
  max_timesteps: 1000000
  n_timesteps: 1000000
  eval_freq: 100000
  log_every: 500

  # Dataset / preprocessing. Keep this false for FQL reproduction.
  batch_size: 256
  normalize_states: false
  normalize_reward: false
  action_clip_eps: 0.00001
  frame_stack: null
  p_aug: null

  # FQL ReBRAC network/optimization settings.
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  hidden_dim: 512
  actor_n_hiddens: 4
  critic_n_hiddens: 4
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  num_critics: 2

  # FQL ReBRAC loss / target settings.
  discount: 0.99
  tau: 0.005
  actor_ln: false
  critic_ln: true
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  normalize_q: true
  tanh_squash: true
  actor_fc_scale: 0.01
  encoder: null

  # Evaluation / saving.
  n_episodes: 50
  eval_seed: 42
  actor_refit_dir_name: "actor_refit"
  eval_at_first_step: true

_ogbench_discount_0995: &ogbench_discount_0995
  <<: *ogbench_common
  discount: 0.995

_ogbench_visual_common: &ogbench_visual_common
  <<: *ogbench_common
  max_timesteps: 500000
  n_timesteps: 500000
  encoder: impala_small
  p_aug: 0.5
  frame_stack: 3

