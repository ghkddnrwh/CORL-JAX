# Hyperparameters for ReBRAC-JAX.
#
# Notes:
# - This file follows the same RL-Zoo-style format as the IQL-JAX YAML:
#   each top-level environment id has its own config.
# - Values are converted from the original ReBRAC per-environment YAML files.
# - Original schedule mapping:
#     num_epochs: 1000 and num_updates_on_epoch: 1000 -> max_timesteps: 1000000
#     eval_every * num_updates_on_epoch -> eval_freq
#     eval_episodes -> n_episodes
#     train_seed -> seed
# - CLI arguments override values loaded from this YAML file.
# - YAML anchors/merge keys are used to avoid repeating identical hyperparameters.
# - Top-level keys beginning with `_` are anchor definitions, not environments.

_common: &common
  max_timesteps: 1000000
  eval_freq: 25000
  log_every: 500
  seed: 0
  eval_seed: 42

  # Network / target updates
  hidden_dim: 256
  actor_n_hiddens: 3
  critic_n_hiddens: 3
  actor_ln: false
  critic_ln: true
  gamma: 0.99
  tau: 0.005

  # ReBRAC target-policy smoothing and delayed actor updates
  policy_noise: 0.2
  noise_clip: 0.5
  policy_freq: 2
  normalize_q: true

  # Dataset normalization
  normalize_states: false

_mujoco: &mujoco
  <<: *common
  n_episodes: 10
  batch_size: 1024
  normalize_reward: false
  actor_learning_rate: 0.001
  critic_learning_rate: 0.001

_antmaze: &antmaze
  <<: *common
  eval_freq: 25000
  n_episodes: 100
  batch_size: 256
  normalize_reward: true
  gamma: 0.999
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.00005

_maze2d: &maze2d
  <<: *common
  n_episodes: 100
  batch_size: 256
  normalize_reward: false
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  actor_bc_coef: 0.003
  critic_bc_coef: 0.001

_adroit: &adroit
  <<: *common
  n_episodes: 10
  batch_size: 256
  normalize_reward: false
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003

