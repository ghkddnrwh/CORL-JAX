# Hyperparameters for CDAF-JAX (Conservative Delayed Advantage Filtering)
#
# Notes:
# - This file follows an RL-Zoo-style format: each top-level environment id has its own config.
# - `n_timesteps` is treated as an alias for `max_timesteps` by the CDAF runner.
# - CLI arguments override values loaded from this YAML file.
# - YAML anchors/merge keys are used to avoid repeating identical hyperparameters.
# - Top-level keys beginning with `_` are anchor definitions, not environments.

_common: &common
  buffer_size: 10000000


_mujoco: &mujoco
  <<: *common

_antmaze: &antmaze
  <<: *common
  n_episodes: 10
  normalize_reward: true

# -----------------------------------------------------------------------------
# MuJoCo locomotion: 3 environments x 6 datasets
# Environments: halfcheetah, hopper, walker2d
# Datasets: random, medium, medium-replay, medium-expert, expert, full-replay
# -----------------------------------------------------------------------------

# HalfCheetah
halfcheetah-random-v2:
  <<: *mujoco

halfcheetah-medium-v2:
  <<: *mujoco

halfcheetah-medium-replay-v2:
  <<: *mujoco

halfcheetah-medium-expert-v2:
  <<: *mujoco

halfcheetah-expert-v2:
  <<: *mujoco

halfcheetah-full-replay-v2:
  <<: *mujoco

# Hopper
hopper-random-v2:
  <<: *mujoco

hopper-medium-v2:
  <<: *mujoco

hopper-medium-replay-v2:
  <<: *mujoco

hopper-medium-expert-v2:
  <<: *mujoco

hopper-expert-v2:
  <<: *mujoco

hopper-full-replay-v2:
  <<: *mujoco

# Walker2d
walker2d-random-v2:
  <<: *mujoco

walker2d-medium-v2:
  <<: *mujoco

walker2d-medium-replay-v2:
  <<: *mujoco

walker2d-medium-expert-v2:
  <<: *mujoco

walker2d-expert-v2:
  <<: *mujoco

walker2d-full-replay-v2:
  <<: *mujoco

# -----------------------------------------------------------------------------
# AntMaze: 6 datasets
# -----------------------------------------------------------------------------

antmaze-umaze-v2:
  <<: *antmaze

antmaze-umaze-diverse-v2:
  <<: *antmaze

antmaze-medium-play-v2:
  <<: *antmaze

antmaze-medium-diverse-v2:
  <<: *antmaze

antmaze-large-play-v2:
  <<: *antmaze

antmaze-large-diverse-v2:
  <<: *antmaze
