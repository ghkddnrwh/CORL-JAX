# Hyperparameters for DAVE-IQL-JAX
#
# DAVE-IQL = Decoupled Advantage-filtered Value Estimation IQL.
# This file matches dave_iql_jax.py.
#
# Main differences from the original IQL hyperparameters:
# - `iql_tau` is intentionally omitted because DAVE-IQL does not use expectile regression.
#   The code may still keep an `iql_tau` field for checkpoint/config compatibility, but it is unused.
# - Value learning is controlled by the DAVE-specific soft filtering parameters below.
# - `n_timesteps` is still treated as an alias for `max_timesteps` by the runner.
# - CLI arguments override values loaded from this YAML file.
# - YAML anchors/merge keys are used to avoid repeating identical hyperparameters.
# - Top-level keys beginning with `_` are anchor definitions, not environments.

_common: &common
  buffer_size: 10000000


_mujoco: &mujoco
  <<: *common
  n_episodes: 10
  normalize_reward: false

  # MuJoCo locomotion is usually stable with moderately soft value filtering.
  delayed_update_freq: 1000
  v_filter_temperature: 3.0
  v_filter_clip: 3.0
  v_filter_floor: 0.2
  v_filter_baseline: "mean"

_hopper_medium: &hopper_medium
  <<: *mujoco
  tau: 0.001
  iql_deterministic: true
  normalize_reward: true

_hopper_medium_expert: &hopper_medium_expert
  <<: *mujoco
  beta: 6.0

_antmaze: &antmaze
  <<: *common
  n_episodes: 10
  normalize_reward: true
  beta: 10.0



_maze2d: &maze2d
  <<: *common
  n_episodes: 100
  normalize_reward: false

  delayed_update_freq: 1000
  v_filter_temperature: 3.0
  v_filter_clip: 3.0
  v_filter_floor: 0.2
  v_filter_baseline: "mean"

_adroit: &adroit
  <<: *common
  n_episodes: 10
  normalize_reward: false
  actor_dropout: 0.1

  # Adroit datasets are often narrow and noisy; use softer value filtering.
  delayed_update_freq: 2000
  v_filter_temperature: 5.0
  v_filter_clip: 3.0
  v_filter_floor: 0.3
  v_filter_baseline: "mean"

# -----------------------------------------------------------------------------
# MuJoCo locomotion: 3 environments x 6 datasets
# Environments: halfcheetah, hopper, walker2d
# Datasets: random, medium, medium-replay, medium-expert, expert, full-replay
