# Hyperparameters for CP-CDAF-JAX
# Pure in-sample setting: use weighted behavior cloning for actor extraction.
#
# Only values different from TrainConfig defaults are listed here.
# CLI arguments override values loaded from this YAML file.

_common: &common
  buffer_size: 10000000


_mujoco: &mujoco
  <<: *common

_antmaze: &antmaze
  <<: *common
  n_episodes: 100
  normalize_reward: true


# -----------------------------------------------------------------------------
# MuJoCo locomotion
# -----------------------------------------------------------------------------

